name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Generar tarjeta de estadísticas generales
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: stats
          path: github-stats.svg
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dracula&include_all_commits=true&count_private=true
          token: ${{ secrets.GITHUB_TOKEN }}

      # Generar tarjeta de lenguajes más usados
      - name: Generate languages card
        uses: stats-organization/github-readme-stats-action@v1
        with:
          card: top-langs
          path: top-langs.svg
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=7&theme=dracula
          token: ${{ secrets.GITHUB_TOKEN }}

      # Hacer commit y push de ambos archivos .svg
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg
          git commit -m "Update README stats and languages" || exit 0
          git push
